function renderFormField(f, idx){
  const id = `cf_${idx}`;
  if(f.type==='sizeChips'){
    return `<div class="field-group"><label>${f.label}</label>
      ${FILTER_SIZE_GROUPS.map(([title,sizes])=>`
        <p class="filter-sub">${title}</p>
        <div class="chip-wrap">
          ${sizes.map(s=>`<button type="button" class="fchip" data-fsize="${s}">${s}</button>`).join('')}
        </div>`).join('')}
      <input type="hidden" id="${id}">
    </div>`;
  }
  if(f.type==='chips'){
    return `<div class="field-group"><label>${f.label}</label>
      <div class="chip-wrap" data-single="${id}">
        ${f.options.map(o=>`<button type="button" class="fchip" data-val="${o}">${o}</button>`).join('')}
      </div>
      <input type="hidden" id="${id}">
    </div>`;
  }
  if(f.type==='multiChips'){
    return `<div class="field-group"><label>${f.label}</label>
      <div class="chip-wrap" data-multi="${id}">
        ${f.options.map(o=>`<button type="button" class="fchip" data-val="${o}">${o}</button>`).join('')}
      </div>
      <input type="hidden" id="${id}">
    </div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field-group"><label>${f.label}</label><textarea id="${id}" placeholder="${f.placeholder||''}"></textarea></div>`;
  }
  if(f.type==='select'){
    return `<div class="field-group"><label>${f.label}</label><select id="${id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
  }
  if(f.type==='bool'){
    return `<div class="field-group"><label>${f.label}</label>
      <div class="bool-toggle" data-bool="${id}">
        <button type="button" class="bt-yes" data-val="Да">Да</button>
        <button type="button" class="bt-no" data-val="Нет">Нет</button>
      </div>
      <input type="hidden" id="${id}">
    </div>`;
  }
  if(f.type==='money'){
    return `<div class="field-group"><label>${f.label}</label>
      <div style="display:flex;gap:8px">
        <input id="${id}" type="number" placeholder="${f.placeholder||''}" style="flex:2">
        <select id="${id}_period" style="flex:1">${f.periodOptions.map(o=>`<option>${o}</option>`).join('')}</select>
      </div>
    </div>`;
  }
  if(f.type==='files'){

function wireBoolToggles(root){
  $all('.bool-toggle', root).forEach(group=>{
    const hiddenId = group.dataset.bool;
    const hidden = document.getElementById(hiddenId);
    group.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        if(hidden) hidden.value = btn.dataset.val;
      };
    });
  });
}

function wireFormChips(){
  $all('[data-fsize]').forEach(b=>{
    b.onclick=()=>{
      b.classList.toggle('active');
      const hidden = b.closest('.field-group').querySelector('input[type="hidden"]');
      if(hidden){
        const picked = [...b.closest('.field-group').querySelectorAll('[data-fsize].active')].map(x=>x.dataset.fsize);
        hidden.value = picked.join(', ');
      }
    };
  });
  $all('[data-single]').forEach(group=>{
    const hidden = document.getElementById(group.dataset.single);
    group.querySelectorAll('[data-val]').forEach(b=>{
      b.onclick=()=>{
        group.querySelectorAll('[data-val]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        if(hidden) hidden.value = b.dataset.val;
      };
    });
  });
  $all('[data-multi]').forEach(group=>{
    const hidden = document.getElementById(group.dataset.multi);
    group.querySelectorAll('[data-val]').forEach(b=>{
      b.onclick=()=>{
        b.classList.toggle('active');
        if(hidden){
          hidden.value = [...group.querySelectorAll('[data-val].active')].map(x=>x.dataset.val).join(', ');
        }
      };
    });
  });
}

function wireListingMetro(){
  state.listing.metro = null;
  renderListingMetroSelected();
  const input = $('#listingMetroInput');
  input.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase().trim();
    const box = $('#listingMetroSuggestions');
    if(!q){ box.innerHTML=''; return; }
    const matches = METRO_LIST.filter(m=>m.name.toLowerCase().startsWith(q) || m.tr.startsWith(q)).slice(0,5);
    box.innerHTML = matches.length ? matches.map(m=>`
      <div class="search-result-row" data-metro="${m.name}" style="cursor:pointer">
        <div class="ico" style="width:28px;height:28px;font-size:13px">🚇</div><div><strong>${m.name}</strong></div>
      </div>`).join('') : `<p style="color:var(--ink-soft);font-size:12px;padding:8px 4px">Станция не найдена</p>`;
    $all('#listingMetroSuggestions [data-metro]').forEach(row=>{
      row.onclick=()=>{
        state.listing.metro = row.dataset.metro;
        input.value = '';
        box.innerHTML = '';
        renderListingMetroSelected();
      };
    });
  });
}
function renderListingMetroSelected(){
  const el = $('#listingMetroSelected');
  if(!el) return;
  el.innerHTML = state.listing.metro
    ? `<span class="metro-chip">🚇 ${state.listing.metro}<button type="button" id="removeListingMetro">✕</button></span>`
    : '';
  if($('#removeListingMetro')){
    $('#removeListingMetro').onclick=()=>{ state.listing.metro=null; renderListingMetroSelected(); };
  }
}
function wireUploadRow(){
  $all('#uploadRow .upload-box').forEach(box=>{
    const input = box.querySelector('input[type="file"]');
    input.onchange = e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        box.style.backgroundImage = `url('${reader.result}')`;
        box.classList.add('filled');
        const icon = box.querySelector('.upload-icon');
        if(icon) icon.style.display = 'none';
        if(!box.querySelector('.upload-remove')){
          const rm = document.createElement('button');
          rm.className = 'upload-remove';
          rm.type = 'button';
          rm.textContent = '✕';
          rm.onclick = (e)=>{
            e.preventDefault(); e.stopPropagation();
            box.style.backgroundImage = '';
            box.classList.remove('filled');
            input.value = '';
            if(icon) icon.style.display = '';
            rm.remove();
          };
          box.appendChild(rm);
        }
      };
      reader.readAsDataURL(file);
    };
  });
}

          ${bannerBox(b, `Вверху раздела «${s}»`)}
          <label class="vendor-add-row" style="display:block;text-align:center;cursor:pointer">
            ${b?'Заменить':'+ Загрузить фото или видео'}
            <input type="file" accept="image/*,video/*" hidden data-subbanner="${c.id}|${s}">
          </label>
        </div>`;
      }).join('')}
    </div>`).join('');
  const readFile = (file, cb)=>{
    const reader = new FileReader();
    reader.onload = ()=>cb({type: file.type.startsWith('video')?'video':'image', src: reader.result});
    reader.readAsDataURL(file);
  };
  $all('[data-banner]').forEach(inp=>{
    inp.onchange = e=>{
      const file = e.target.files[0]; if(!file) return;
      const cat = catById(inp.dataset.banner);
      readFile(file, b=>{ cat.banner = b; renderAdminBannerList(); toast(`Баннер «${cat.name}» обновлён`); });
    };
  });
  $all('[data-subbanner]').forEach(inp=>{
    inp.onchange = e=>{
      const file = e.target.files[0]; if(!file) return;
      const [catId, sub] = inp.dataset.subbanner.split('|');
      const cat = catById(catId);
      cat.subBanners = cat.subBanners || {};
      readFile(file, b=>{ cat.subBanners[sub] = b; renderAdminBannerList(); toast(`Баннер «${sub}» обновлён`); });
    };
  });
  $all('[data-delbanner]').forEach(b=>{
    b.onclick=()=>{ catById(b.dataset.delbanner).banner = null; renderAdminBannerList(); toast('Баннер удалён'); };
  });
  $all('[data-shopbanner]').forEach(inp=>{
    inp.onchange = e=>{
      const file = e.target.files[0]; if(!file) return;
      const [catId, shopId] = inp.dataset.shopbanner.split('|');
      const shop = catById(catId).shops.find(s=>s.id===shopId);
      readFile(file, b=>{ shop.banner = b; renderAdminBannerList(); toast(`Баннер «${shop.name}» обновлён`); });
    };
  });
  $all('[data-delshopbanner]').forEach(b=>{
    b.onclick=()=>{
      const [catId, shopId] = b.dataset.delshopbanner.split('|');
      const shop = catById(catId).shops.find(s=>s.id===shopId);
      shop.banner = null;
      renderAdminBannerList(); toast('Баннер удалён');
    };
  });
  $all('[data-delsubbanner]').forEach(b=>{
    b.onclick=()=>{
      const [catId, sub] = b.dataset.delsubbanner.split('|');
      const cat = catById(catId);
      if(cat.subBanners) delete cat.subBanners[sub];
      renderAdminBannerList(); toast('Баннер удалён');
    };
  });
}

  $('#editReplyBtn').onclick=()=>{

function renderVendorCatList(shop){
  $('#vendorCatList').innerHTML = shop.subcats.map(sub=>{
    const items = shop.catalog[sub]||[];
    return `
    <div class="vendor-cat-block">
      <div class="vendor-cat-block-head">
        <h4>${sub} (${items.length})</h4>
        <div class="vendor-cat-actions">
          <button class="vendor-icon-btn" data-rename="${sub}">✏️</button>
          <button class="vendor-icon-btn" data-delcat="${sub}">🗑️</button>
        </div>
      </div>
      ${items.map((it,i)=>{
        const meta = it[2]||{};
        const thumbStyle = meta.photo ? `style="background-image:url('${meta.photo}')"` : '';
        return `
        <div class="vendor-product-row">
          <div class="vendor-product-thumb" ${thumbStyle}>${meta.photo?'':'👕'}</div>
          <div class="vendor-product-info">
            <strong>${it[0]}</strong>
            <span>${it[1]}${meta.popular?' · <span class="pop-tag">🔥 в топе</span>':''}</span>
          </div>
          <button class="vendor-icon-btn" data-editprod="${sub}|${i}">✏️</button>
          <button class="vendor-icon-btn" data-delprod="${sub}|${i}">🗑️</button>
        </div>`;
      }).join('')}
      <button class="vendor-add-row" data-addprod="${sub}">+ Добавить товар</button>
    </div>`;
  }).join('');
  $all('[data-rename]').forEach(b=>b.onclick=()=>renameVendorCategory(shop, b.dataset.rename));
  $all('[data-delcat]').forEach(b=>b.onclick=()=>deleteVendorCategory(shop, b.dataset.delcat));
  $all('[data-addprod]').forEach(b=>b.onclick=()=>openVendorProductModal(shop, b.dataset.addprod, null));
  $all('[data-editprod]').forEach(b=>{
    const [sub,i] = b.dataset.editprod.split('|');
    b.onclick=()=>openVendorProductModal(shop, sub, +i);
  });
  $all('[data-delprod]').forEach(b=>{
    const [sub,i] = b.dataset.delprod.split('|');
    b.onclick=()=>{
      if(!confirm('Удалить этот товар?')) return;
      shop.catalog[sub].splice(+i,1);
      renderVendorDashboard();
    };
  });
}
function renameVendorCategory(shop, oldName){
  const name = prompt('Новое название категории', oldName);
  if(!name || !name.trim() || name.trim()===oldName) return;
  const newName = name.trim();
  if(shop.subcats.includes(newName)){ toast('Такая категория уже есть'); return; }
  shop.subcats = shop.subcats.map(s=>s===oldName?newName:s);
  shop.catalog[newName] = shop.catalog[oldName];
  delete shop.catalog[oldName];
  renderVendorDashboard();
}
function deleteVendorCategory(shop, name){
  if(!confirm(`Удалить категорию «${name}» вместе со всеми товарами?`)) return;
  shop.subcats = shop.subcats.filter(s=>s!==name);
  delete shop.catalog[name];
  renderVendorDashboard();
}
function openVendorProductModal(shop, sub, idx){
  const isEdit = idx!==null;
  const it = isEdit ? shop.catalog[sub][idx] : ['', '', {photo:null, desc:'', popular:false}];
  const meta = it[2] || {photo:null, desc:'', popular:false};
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Редактировать товар':'Новый товар'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="font-size:12.5px;color:var(--green-700);font-weight:700;margin-bottom:14px">${shop.name} → ${sub}</p>
    <div class="field-group"><label>Фотография</label>
      <div class="upload-row">
        <label class="upload-box${meta.photo?' filled':''}" id="vpPhotoBox" ${meta.photo?`style="background-image:url('${meta.photo}')"`:''}>
          <span class="upload-icon" style="${meta.photo?'display:none':''}">📷</span>
          <input type="file" accept="image/*" hidden id="vpPhotoInput">
        </label>
      </div>
    </div>
    <div class="field-group"><label>Название*</label><input type="text" id="vpName" value="${it[0]||''}" placeholder="Например: Футболка базовая оверсайз"></div>
    <div class="field-group"><label>Бренд</label><input type="text" id="vpBrand" value="${meta.brand||''}" placeholder="Например: Ailun Basic"></div>
    <div class="field-group"><label>Цена*</label><input type="text" id="vpPrice" value="${it[1]||''}" placeholder="Например: 1 690 ₽"></div>
    <div class="field-group"><label>Старая цена (для скидки)</label><input type="text" id="vpOldPrice" value="${meta.oldPrice||''}" placeholder="Например: 2 190 ₽ — процент посчитается сам"></div>
    <div style="display:flex;gap:8px">
      <div class="field-group" style="flex:1"><label>Рейтинг</label><input type="text" id="vpRating" value="${meta.rating||''}" placeholder="4.7"></div>
      <div class="field-group" style="flex:1"><label>Отзывов</label><input type="number" id="vpReviews" value="${meta.reviews||''}" placeholder="38"></div>
    </div>
    <div class="field-group"><label>Размеры (через запятую)</label><input type="text" id="vpSizes" value="${(meta.sizes||[]).join(', ')}" placeholder="S, M, L, XL"></div>
    <div class="field-group"><label>Цвет</label>
      <select id="vpColor">
        <option value="">Не указан</option>
        ${Object.keys(COLOR_MAP).map(c=>`<option ${meta.color===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field-group"><label>Описание</label><textarea id="vpDesc" placeholder="Кратко расскажите о товаре">${meta.desc||''}</textarea></div>
    <div class="field-group"><label>Показывать в топе продаж</label>
      <div class="bool-toggle" data-bool="vpPopular">
        <button type="button" data-val="Да" class="${meta.popular?'active':''}">Да</button>
        <button type="button" data-val="Нет" class="${!meta.popular?'active':''}">Нет</button>
      </div>
      <input type="hidden" id="vpPopular" value="${meta.popular?'Да':'Нет'}">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" id="vpSaveBtn">Сохранить</button>
    ${isEdit?`<button class="btn btn-ghost" style="width:100%;justify-content:center" id="vpDeleteBtn">Удалить товар</button>`:''}
  `);
  let newPhoto = meta.photo;
  wireBoolToggles(document);
  $('#vpPhotoInput').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      newPhoto = reader.result;
      const box = $('#vpPhotoBox');
      box.style.backgroundImage = `url('${newPhoto}')`;
      box.classList.add('filled');
      box.querySelector('.upload-icon').style.display='none';
    };
    reader.readAsDataURL(file);
  };
  $('#vpSaveBtn').onclick=()=>{
    const name = $('#vpName').value.trim();
    const price = $('#vpPrice').value.trim();
    if(!name || !price){ toast('Заполните название и цену'); return; }
    const oldPrice = $('#vpOldPrice').value.trim();
    const parseNum = s => { const n = parseInt(String(s).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; };
    const p = parseNum(price), op = parseNum(oldPrice);
    const discount = (op && p && op>p) ? Math.round((1 - p/op)*100) : 0;
    const newMeta = {
      photo:newPhoto,
      desc:$('#vpDesc').value.trim(),
      popular:$('#vpPopular').value==='Да',
      brand:$('#vpBrand').value.trim(),
      oldPrice: discount ? oldPrice : '',
      discount,
      rating: parseFloat(String($('#vpRating').value).replace(',','.')) || null,
      reviews: parseInt($('#vpReviews').value,10) || 0,
      sizes: $('#vpSizes').value.split(',').map(s=>s.trim()).filter(Boolean),
      color: $('#vpColor').value
    };
    const newItem = [name, price, newMeta];
    if(isEdit){ shop.catalog[sub][idx] = newItem; }
    else { shop.catalog[sub].push(newItem); }
    closeModal();
    renderVendorDashboard();
    toast(isEdit?'Товар обновлён':'Товар добавлен');
  };
  if(isEdit){
    $('#vpDeleteBtn').onclick=()=>{
      if(!confirm('Удалить этот товар?')) return;
      shop.catalog[sub].splice(idx,1);
      closeModal();
      renderVendorDashboard();
    };
  }
}

/* ---- Vacancies (search + filters + promotion) ---- */
function openVacancies(cat){
  state.activeCat = 'jobs';
  renderVacanciesScreen(cat);
  showScreen('provider');
}
function matchesJobFilters(v){
  const f = state.jobFilters;
  if(f.city!=='Все города' && v.city!==f.city) return false;
  if(f.schedule!=='Любой график' && v.schedule!==f.schedule) return false;
  if(f.experience!=='Любой опыт' && v.experience!==f.experience) return false;
  if(f.salaryFrom && v.salaryTo < Number(f.salaryFrom)) return false;
  if(f.search && f.search.trim()){
    const q = f.search.trim().toLowerCase();
    if(!v.title.toLowerCase().includes(q) && !v.company.toLowerCase().includes(q)) return false;
  }
  return true;
}
function vacancyCard(v){
  const highlight = v.colored ? 'background:var(--gold-100);border:1px solid var(--gold);box-shadow:none;' : '';
  return `
    <div class="provider-card" data-vac="${v.id}" style="align-items:flex-start;${highlight}">
      <div class="provider-thumb">💼</div>
      <div class="provider-info">
        ${v.promoted?'<span style="background:var(--green-700);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-bottom:4px;display:inline-block">ТОП</span>':''}
        <h3>${v.title}</h3>
        <p>${v.company} · ${v.city}</p>
        <p style="color:var(--green-700);font-weight:700;margin-top:3px;font-size:13px">${money(v.salaryFrom)}–${money(v.salaryTo)} ${v.currency||'₽'}</p>
        <div class="provider-meta" style="margin-top:4px"><span>${v.schedule}</span><span>·</span><span>${v.experience}</span></div>
      </div>
      <span class="heart" data-fav="job-${v.id}" style="margin-left:8px;flex-shrink:0">${state.favorites.has('job-'+v.id)?'❤️':'🤍'}</span>

}

function renderJobSearchSuggestions(cat, query){
  const box = $('#jobSearchSuggestions');
  if(!box) return;
  const q = query.trim().toLowerCase();
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const matches = VACANCIES.filter(v=>v.title.toLowerCase().includes(q) || v.company.toLowerCase().includes(q)).slice(0,8);
  box.innerHTML = matches.length ? matches.map((v,i)=>`
    <button type="button" class="cat-search-suggest-item" data-idx="${i}">
      <span class="css-name">💼 ${v.title} <span class="css-sub">· ${v.company}</span></span>
      <span class="css-price">${money(v.salaryFrom)}–${money(v.salaryTo)} ${v.currency||'₽'}</span>
    </button>`).join('') : `<div class="cat-search-empty">Ничего не найдено по «${query}»</div>`;
  box.classList.add('open');
  $all('#jobSearchSuggestions .cat-search-suggest-item').forEach((btn,i)=>{
    btn.onclick=()=>openVacancyDetail(matches[i].id, cat);
  });
}
function wireJobSearch(cat){
  const input = $('#jobSearchInput');
  const box = $('#jobSearchSuggestions');
  if(!input) return;
  input.addEventListener('input', e=>{
    state.jobFilters.search = e.target.value;
    renderJobSearchSuggestions(cat, e.target.value);
    renderVacancyList(cat);
  });
  input.addEventListener('focus', e=>{ if(e.target.value.trim()) renderJobSearchSuggestions(cat, e.target.value); });
  input.addEventListener('blur', ()=>setTimeout(()=>{ if(box) box.classList.remove('open'); }, 150));
}
function renderVacancyList(cat){
  const list = VACANCIES.filter(matchesJobFilters);
  $('#vacancyList').innerHTML = list.length
    ? list.map(vacancyCard).join('')
    : `<p style="color:var(--ink-soft);font-size:13px;text-align:center;margin-top:20px">Ничего не найдено по вашим фильтрам</p>`;
  $all('#vacancyList [data-vac]').forEach(c=>{
    c.onclick=(e)=>{ if(e.target.closest('[data-fav]')) return; openVacancyDetail(+c.dataset.vac, cat); };
  });
  $all('#vacancyList [data-fav]').forEach(h=>{
    h.onclick=(e)=>{
      e.stopPropagation();
      const key=h.dataset.fav;
      if(state.favorites.has(key)){state.favorites.delete(key); h.textContent='🤍';}
      else {state.favorites.add(key); h.textContent='❤️'; toast('Добавлено в избранное');}
    };
  });
}
function openJobFiltersModal(cat){
  const cities = ['Все города','Москва','Московская область'];

  const exps = ['Любой опыт','Без опыта','От 1 года','От 2 лет','От 3 лет'];

    <div class="modal-head"><h3>Фильтры</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

    <div class="field-group"><label>Опыт</label><select id="fExperience">${exps.map(c=>`<option ${state.jobFilters.experience===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field-group"><label>Зарплата от, ₽</label><input type="number" id="fSalary" value="${state.jobFilters.salaryFrom}" placeholder="Например: 70000"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" id="applyFiltersBtn">Показать вакансии</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center" id="resetFiltersBtn">Сбросить фильтры</button>
  `);
  $('#applyFiltersBtn').onclick=()=>{
    state.jobFilters = {
      city: $('#fCity').value, schedule: $('#fSchedule').value,
      experience: $('#fExperience').value, salaryFrom: $('#fSalary').value,
      search: state.jobFilters.search||''
    };
    closeModal();
    renderVacancyList(cat);

  $('#resetFiltersBtn').onclick=()=>{
    state.jobFilters = {city:'Все города', schedule:'Любой график', experience:'Любой опыт', salaryFrom:'', search: state.jobFilters.search||''};
    closeModal();
    renderVacancyList(cat);

      company: $('#vCompany').value || 'Ваша компания',
      city: $('#vCity').value,
      address: $('#vAddress').value,
      salaryFrom: Number($('#vSalaryFrom').value)||0,
      salaryTo: Number($('#vSalaryTo').value)||0,
      currency: $('#vCurrency').value,
      schedule: $('#vSchedule').value,
      employmentType: $('#vEmpType').value,
      workFormat: $('#vFormat').value,
      experience: $('#vExperience').value,
      education: $('#vEducation').value,
      skills: $('#vSkills').value,
      language: $('#vLanguage').value,
      desc: $('#vDesc').value,
      duties: $('#vDuties').value,
      requirements: $('#vReqs').value,
      conditions: $('#vConditions').value,
      phone: $('#vPhone').value,
      max: $('#vMax').value,
      promoted:false, colored:false, recommended:false
    });
    closeModal();
    toast('Вакансия отправлена на модерацию ✓');
    openPromoteModal(title);
  };
}

/* ---- Chat (employer <-> candidate demo) ---- */
function openChat(personName){
  if(!state.chats[personName]){
    state.chats[personName] = [
      {from:'them', text:'Здравствуйте! Спасибо за интерес, расскажите немного о себе.'},
      {from:'me', text:'Добрый день! Готов(а) обсудить детали и пройти собеседование.'}
    ];
  }
  openModal(`
    <div class="modal-head"><h3>💬 ${personName}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="chatMessages" style="max-height:300px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px"></div>
    <div style="display:flex;gap:8px">
      <input type="text" id="chatInput" placeholder="Написать сообщение..." style="flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;background:var(--green-50)">
      <button class="btn btn-primary" id="chatSendBtn">➤</button>
    </div>
  `);
  renderChatMessages(personName);
  $('#chatSendBtn').onclick=()=>{
    const val = $('#chatInput').value.trim();
    if(!val) return;
    state.chats[personName].push({from:'me', text:val});
    $('#chatInput').value='';
    renderChatMessages(personName);
    setTimeout(()=>{
      state.chats[personName].push({from:'them', text:'Спасибо, я передам информацию дальше.'});
      renderChatMessages(personName);
    }, 900);
  };
}
function renderChatMessages(personName){
  const box = $('#chatMessages');
  if(!box) return;
  box.innerHTML = state.chats[personName].map(m=>`
    <div style="align-self:${m.from==='me'?'flex-end':'flex-start'};background:${m.from==='me'?'var(--green-700)':'var(--green-50)'};color:${m.from==='me'?'#fff':'var(--ink)'};padding:9px 13px;border-radius:14px;max-width:80%;font-size:13px">${m.text}</div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

/* ---- Monetization: boosts + employer subscriptions ---- */
function openPromoteModal(vacancyTitle){
  openModal(`
    <div class="modal-head"><h3>Продвижение вакансии</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px">«${vacancyTitle}» — выберите способ продвижения:</p>
    <div class="subcat-list">
      <button data-boost="top"><span>🚀 Поднять в поиске — 500 ₽ / 7 дней</span></button>
      <button data-boost="color"><span>🎨 Выделить цветом — 300 ₽ / 7 дней</span></button>
      <button data-boost="recommended"><span>⭐ В «Рекомендуемые вакансии» — 800 ₽ / 7 дней</span></button>
    </div>
    <div class="section-head" style="margin-top:18px"><h2 style="font-size:14px">Подписка для работодателей</h2></div>
    <div class="modal-cat-grid" style="grid-template-columns:1fr 1fr 1fr">
      <button data-plan="basic"><span style="font-size:18px">📦</span><span>Базовая<br>990 ₽/мес</span></button>
      <button data-plan="pro"><span style="font-size:18px">🚀</span><span>Про<br>2 490 ₽/мес</span></button>
      <button data-plan="business"><span style="font-size:18px">🏢</span><span>Бизнес<br>4 990 ₽/мес</span></button>
    </div>
    <p style="font-size:11px;color:var(--ink-soft);margin-top:10px">Демо: оплата не подключена — это макет для показа функционала.</p>
  `);
  $all('[data-boost]').forEach(b=>b.onclick=()=>{ closeModal(); toast('Демо: вакансия продвинута ✓'); });
  $all('[data-plan]').forEach(b=>b.onclick=()=>{ closeModal(); toast('Демо: подписка оформлена ✓'); });
}

renderAuth();
renderHomeGrid();
initMetroSearch();
</script>
