<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ailun.ru — маркетплейс объявлений Москвы и России</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#0A2E1C;
    --green-900:#0F3D24;
    --green-700:#167A47;
    --green-600:#1B8F53;
    --green-500:#2FA365;
    --green-100:#E9F6EE;
    --green-50:#F4FBF6;
    --gold:#C9972E;
    --gold-100:#FBF3E1;
    --ink:#122318;
    --ink-soft:#4B5D53;
    --line:#E1EBE4;
    --white:#FFFFFF;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 24px rgba(15,61,36,.10);
    --shadow-lg:0 20px 50px rgba(10,46,28,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% -10%, #1a5c39 0%, transparent 55%),
      linear-gradient(160deg,var(--green-950) 0%,var(--green-900) 45%,#0c3220 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold-100);color:var(--green-900);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* lattice signature texture */
  .lattice{
    position:absolute;inset:0;opacity:.10;pointer-events:none;
    background-image:
      linear-gradient(45deg, var(--white) 1px, transparent 1px),
      linear-gradient(-45deg, var(--white) 1px, transparent 1px);
    background-size:26px 26px;
  }

  /* ===== HALAL VERIFIED BADGE ===== */
  .halal-mark{
    display:inline-flex;align-items:center;gap:4px;vertical-align:middle;
    background:#1B5138;color:#fff;border-radius:999px;
    padding:2px 8px 2px 6px;font-size:10px;font-weight:800;
    letter-spacing:.4px;line-height:1.5;white-space:nowrap;
  }
  .halal-mark svg{width:11px;height:11px;flex:none;}
  .halal-mark.lg{font-size:11.5px;padding:3px 10px 3px 8px;}
  .halal-mark.lg svg{width:13px;height:13px;}
  .shop-tile{position:relative;}
  .tile-avatar{position:relative;display:inline-flex;}
  .halal-seal{
    position:absolute;right:-5px;bottom:-5px;
    width:22px;height:22px;border-radius:50%;
    background:#1B5138;border:2.5px solid #fff;
    display:grid;place-items:center;
    box-shadow:0 2px 6px rgba(15,61,36,.3);
  }
  .halal-seal svg{width:11px;height:11px;stroke:#fff;}
  .halal-cap{
    display:block;font-size:9.5px;font-weight:800;letter-spacing:.7px;
    color:#1B5138;margin-top:1px;
  }
  .shop-tile .halal-cap{line-height:1.2;}
  .halal-note{
    display:flex;gap:8px;align-items:flex-start;
    background:#EEF6F0;border:1px solid #D3E7DA;border-radius:12px;
    padding:10px 12px;margin:0 0 16px;font-size:11.5px;color:#3D5548;line-height:1.5;
  }
  .admin-halal-row{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .admin-halal-row:last-child{border-bottom:none;}
  .admin-halal-row .grow{flex:1;min-width:0;}
  .admin-halal-row strong{display:block;font-size:13.5px;}
  .admin-halal-row span{font-size:11px;color:var(--ink-soft);}
  .halal-toggle{
    border:none;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;
  }
  .halal-toggle.on{background:#1B5138;color:#fff;}
  .halal-toggle.off{background:#E6EAE7;color:#5F6F65;}
  /* ===== HALAL MARKET ===== */
  .halal-wrap{
    margin:-8px -18px 0;padding:8px 18px 26px;
    background:
      radial-gradient(circle at 50% 120%, rgba(22,122,71,.07) 0%, transparent 60%),
      linear-gradient(180deg,#FBF8F0 0%,#F7F3E8 100%);
    position:relative;overflow:hidden;
  }
  .halal-domes{
    position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;
    opacity:.16;
  }
  .halal-head{text-align:center;padding:14px 0 4px;position:relative;z-index:1;}
  .halal-logo{width:74px;height:74px;margin:0 auto 6px;display:block;}
  .halal-title{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:29px;letter-spacing:.5px;
    color:#12492C;margin:0;text-transform:uppercase;line-height:1.1;
  }
  .halal-tagline{
    font-size:13.5px;color:#5D6B60;margin:8px 0 0;font-weight:500;
  }
  .halal-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    margin-top:22px;position:relative;z-index:1;
  }
  .halal-card{
    border:none;border-radius:20px;padding:20px 10px 16px;
    display:flex;flex-direction:column;align-items:center;gap:0;
    position:relative;cursor:pointer;text-align:center;
    box-shadow:0 4px 14px rgba(18,73,44,.07);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .halal-card:active{transform:scale(.975);}
  .halal-card:hover{box-shadow:0 8px 22px rgba(18,73,44,.13);}
  .halal-card.c1{background:#FBF4DE;}
  .halal-card.c2{background:#E9F2E1;}
  .halal-card.c3{background:#FAE9E6;}
  .halal-card.c4{background:#E3F0E9;}
  .halal-badge{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    width:44px;height:44px;border-radius:50%;background:#1B5138;
    display:grid;place-items:center;font-size:20px;color:#fff;
    box-shadow:0 3px 10px rgba(18,73,44,.28);
  }
  .halal-ill{
    width:112px;height:112px;border-radius:50%;background:#fff;
    display:grid;place-items:center;font-size:52px;margin:20px 0 14px;
    box-shadow:inset 0 0 0 1px rgba(18,73,44,.07);
  }
  .halal-card.c1 .halal-ill{box-shadow:inset 0 0 0 1px rgba(201,151,46,.22);}
  .halal-label{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;
    line-height:1.28;letter-spacing:.2px;text-transform:uppercase;
  }
  .halal-card.c1 .halal-label{color:#1E5A38;}
  .halal-card.c2 .halal-label{color:#1E5A38;}
  .halal-card.c3 .halal-label{color:#8B3A2F;}
  .halal-card.c4 .halal-label{color:#1E5A38;}
  @media(max-width:400px){
    .halal-title{font-size:25px;}
    .halal-ill{width:96px;height:96px;font-size:44px;}
    .halal-label{font-size:13px;}
  }
  .app-shell{
    max-width:480px;margin:0 auto;background:var(--white);
    min-height:100vh;height:100vh;position:relative;box-shadow:var(--shadow-lg);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .status-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 20px 6px;font-size:13px;font-weight:600;color:var(--green-950);
    background:var(--white);
  }
  .status-bar .dots{display:flex;gap:3px;align-items:center;}
  .status-bar .bar{width:3px;background:var(--green-950);border-radius:1px;}
  .status-bar .bar:nth-child(1){height:5px;} .status-bar .bar:nth-child(2){height:7px;}
  .status-bar .bar:nth-child(3){height:9px;} .status-bar .bar:nth-child(4){height:11px;}

  /* ---------- Partner banner ---------- */
  .partner-banner{
    background:linear-gradient(120deg,var(--green-900),var(--green-700));
    color:var(--white);padding:10px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;position:relative;overflow:hidden;
  }
  .partner-banner span{font-size:12.5px;font-weight:500;line-height:1.3;position:relative;z-index:1;}
  .partner-banner b{color:var(--gold);}
  .partner-banner button{
    background:var(--gold);color:var(--green-950);border:none;border-radius:999px;
    padding:7px 13px;font-size:12px;font-weight:700;white-space:nowrap;position:relative;z-index:1;
    box-shadow:0 4px 10px rgba(201,151,46,.4);
  }

  /* ---------- Header ---------- */
  header.main{padding:14px 16px 12px;background:var(--white);border-bottom:1px solid var(--line);}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .logo{display:flex;align-items:center;gap:9px;}
  .logo-mark{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(145deg,var(--green-600),var(--green-900));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .logo-mark svg{width:19px;height:19px;}
  .logo-text{font-family:'Manrope',sans-serif;font-weight:700;font-size:19px;color:var(--green-950);letter-spacing:.2px;}
  .auth-actions{display:flex;align-items:center;gap:8px;}
  .btn{
    border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--green-700);color:var(--white);}
  .btn-primary:hover{background:var(--green-600);}
  .btn-ghost{background:transparent;color:var(--green-700);font-weight:600;padding:9px 8px;}
  .btn-outline{background:var(--white);color:var(--green-900);border:1px solid var(--line);}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--white);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .avatar-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--green-50);
    border-radius:999px;padding:4px 10px 4px 4px;}
  .avatar-circle{width:26px;height:26px;border-radius:50%;background:var(--green-700);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}

  .cta-row{display:flex;gap:8px;}
  .search-field{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--green-50);
    border:1px solid var(--line);border-radius:999px;padding:11px 14px;color:var(--ink-soft);font-size:13.5px;
  }
  .search-field svg{flex-shrink:0;}

  /* ---------- Metro search (Moscow) ---------- */
  .metro-search-bar{position:relative;padding:10px 16px 12px;background:var(--white);border-bottom:1px solid var(--line);}
  .metro-input-wrap{
    display:flex;align-items:center;gap:8px;background:var(--green-50);border:1px solid var(--line);
    border-radius:999px;padding:10px 14px;
  }
  .metro-input-wrap svg{flex-shrink:0;}
  .metro-input-wrap input{border:none;background:transparent;outline:none;flex:1;font-size:13.5px;color:var(--ink);}
  .metro-suggestions{
    display:none;position:absolute;left:16px;right:16px;top:56px;background:var(--white);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;overflow:hidden;
  }
  .metro-suggestions.open{display:block;}
  .metro-suggest-item{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13px;font-weight:600;color:var(--green-950);border-bottom:1px solid var(--line);
  }
  .metro-suggest-item:last-child{border-bottom:none;}
  .metro-suggest-item:hover, .metro-suggest-item:active{background:var(--green-50);}
  .metro-empty{padding:12px 14px;font-size:12.5px;color:var(--ink-soft);}
  .metro-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .metro-chips:empty{margin-top:0;}
  .metro-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-700);color:#fff;border-radius:999px;
    padding:7px 8px 7px 12px;font-size:12px;font-weight:600;
  }
  .metro-chip button{
    background:rgba(255,255,255,.22);border:none;color:#fff;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;flex-shrink:0;
  }

  /* ---------- Category-scoped search ---------- */
  .cat-search-wrap{position:relative;margin:0 0 16px;}
  .cat-search-input-row{
    display:flex;align-items:center;gap:8px;background:var(--green-50);border:1px solid var(--line);
    border-radius:999px;padding:10px 14px;
  }
  .cat-search-input-row svg{flex-shrink:0;}
  .cat-search-input-row input{border:none;background:transparent;outline:none;flex:1;font-size:13.5px;color:var(--ink);font-family:inherit;}
  .cat-search-suggestions{
    display:none;position:absolute;left:0;right:0;top:50px;background:var(--white);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;overflow:hidden;
  }
  .cat-search-suggestions.open{display:block;}
  .cat-search-suggest-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13px;font-weight:600;color:var(--green-950);border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;
  }
  .cat-search-suggest-item:last-child{border-bottom:none;}
  .cat-search-suggest-item:hover, .cat-search-suggest-item:active{background:var(--green-50);}
  .cat-search-suggest-item .css-name{display:flex;align-items:center;gap:8px;min-width:0;}
  .cat-search-suggest-item .css-sub{font-weight:500;color:var(--ink-soft);font-size:11px;white-space:nowrap;}
  .cat-search-suggest-item .css-price{font-weight:700;color:var(--green-700);font-size:12px;flex-shrink:0;white-space:nowrap;}
  .cat-search-empty{padding:12px 14px;font-size:12.5px;color:var(--ink-soft);}

  .cats-strip{display:flex;gap:8px;padding:6px 16px 2px;overflow-x:auto;background:var(--white);}
  .cats-strip::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--green-50);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--green-900);
  }
  .cat-chip.active{background:var(--green-700);color:#fff;border-color:var(--green-700);}

  main{padding:18px 16px 30px;background:var(--green-50);flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- Home: category grid ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px;}
  .section-head h2{font-size:16.5px;margin:0;color:var(--green-950);}
  .section-head .link{font-size:12.5px;font-weight:700;color:var(--green-700);}
  .hero-card{
    position:relative;border-radius:20px;overflow:hidden;padding:22px 18px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--green-900),var(--green-600));color:#fff;
  }
  .hero-card h1{font-size:20px;margin:0 0 6px;line-height:1.25;}
  .hero-card p{margin:0;font-size:13px;color:#dff2e6;line-height:1.5;max-width:80%;}

  .grid-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px;}
  .cat-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cat-card:active{transform:scale(.96);}
  .cat-card .ico{
    width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--green-100);
  }
  .cat-card span{font-size:12px;font-weight:600;line-height:1.25;color:var(--green-950);}
  .cat-card small{font-size:10.5px;color:var(--ink-soft);font-weight:500;}
  .cat-card.active{background:var(--green-700);border-color:var(--green-700);}
  .cat-card.active .ico{background:rgba(255,255,255,.2);}
  .cat-card.active span{color:#fff;}

  .promo-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:24px;padding-bottom:2px;}
  .promo-row::-webkit-scrollbar{display:none;}
  .promo-card{
    flex-shrink:0;width:150px;height:96px;border-radius:14px;padding:12px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px;
  }

  /* ---------- Category icon button (header) ---------- */
  .cat-all-icon-btn{
    display:flex;align-items:center;justify-content:center;background:var(--green-700);border:none;
    border-radius:12px;width:40px;height:40px;flex-shrink:0;box-shadow:0 3px 8px rgba(22,122,71,.28);
  }

  /* ---------- Home: feature tiles + quick row ---------- */
  .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .feature-tile{
    position:relative;border-radius:20px;padding:16px 14px;min-height:104px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;overflow:hidden;text-align:center;
    box-shadow:0 6px 18px rgba(15,61,36,.08);
  }
  .feature-tile .badge-ico{width:52px;height:52px;flex-shrink:0;}
  .feature-tile span.name{font-size:14px;font-weight:800;line-height:1.25;position:relative;z-index:1;
    font-family:'Manrope',sans-serif;letter-spacing:.1px;}
  .feature-tile.tile-a{background:var(--white);border:1px solid var(--line);}
  .feature-tile.tile-a .name{color:var(--green-950);}
  .feature-tile.tile-b{background:linear-gradient(150deg,#1c2a4a,#0d1526);border:1px solid #26365c;}
  .feature-tile.tile-b .name{color:#fff;}

  .quick-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:26px;padding:2px 4px 6px 0;scroll-snap-type:x proximity;}
  .quick-row::-webkit-scrollbar{display:none;}
  .quick-tile{
    flex-shrink:0;width:92px;scroll-snap-align:start;
    background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 6px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  }
  .quick-tile .ico{width:52px;height:52px;border-radius:14px;background:var(--green-100);display:flex;
    align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .quick-tile span{
    font-size:11px;font-weight:700;color:var(--green-950);line-height:1.25;
    width:100%;overflow-wrap:break-word;word-break:break-word;hyphens:auto;
  }
  .quick-tile.tile-more .ico{background:var(--green-700);color:#fff;font-size:26px;font-weight:800;}

  /* ---------- Listings grid (Новые объявления) ---------- */
  .listings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .listing-card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .listing-media{
    height:78px;position:relative;color:#fff;background-size:cover;background-position:center;
  }
  .listing-body{padding:7px 7px 9px;}
  .listing-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;margin-bottom:3px;}
  .listing-price b{color:var(--green-700);font-size:11px;font-weight:800;}
  .listing-price s{color:#9aa79f;font-size:9.5px;font-weight:600;}
  .listing-desc{font-size:9.5px;color:var(--ink-soft);line-height:1.35;margin:0 0 4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px;}
  .listing-tag{font-size:9px;font-weight:700;color:var(--green-900);margin-bottom:6px;}
  .listing-footer{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--ink-soft);}
  .listing-footer .avatar-circle-sm{
    width:15px;height:15px;border-radius:50%;background:var(--green-700);color:#fff;font-size:7.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .listing-footer span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .listing-footer .heart{margin-left:auto;cursor:pointer;font-size:11px;}

  /* ---------- Listing rows (subcategory listings, single column) ---------- */
  .listing-row-card{
    display:flex;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;margin-bottom:10px;padding:8px;
  }
  .listing-row-media{
    width:88px;height:88px;border-radius:10px;flex-shrink:0;background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;
  }
  .listing-row-body{flex:1;min-width:0;padding:2px 2px 2px 0;}
  .listing-row-body h4{font-size:13px;margin:2px 0 5px;font-weight:700;color:var(--green-950);line-height:1.3;}
  .listing-row-actions{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .msg-ico{
    width:24px;height:24px;border-radius:7px;background:var(--green-100);display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;
  }

  .pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 20px;}
  .pagination button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--white);
    font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .pagination button.active{background:var(--green-700);color:#fff;border-color:var(--green-700);}
  .pagination button.nav{border:none;background:none;color:var(--green-700);font-size:15px;}

  /* ---------- Provider list (category screen) ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{
    width:34px;height:34px;border-radius:50%;background:var(--white);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .screen-title{font-size:18px;color:var(--green-950);margin:0;}
  .screen-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}

  .subcat-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .subcat-chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:var(--white);border-radius:999px;
    padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--green-900);
  }
  .chip.active{background:var(--green-900);color:#fff;border-color:var(--green-900);}

  .provider-card{
    display:flex;align-items:center;gap:14px;background:var(--white);border:none;
    border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,61,36,.07);
  }
  .provider-thumb{
    width:56px;height:56px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:linear-gradient(150deg,var(--green-100),var(--green-50));
  }
  .provider-info{flex:1;min-width:0;}
  .provider-info h3{font-size:15px;margin:0 0 3px;color:var(--green-950);font-weight:700;}
  .provider-info p{font-size:12px;margin:0;color:var(--ink-soft);}
  .provider-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);}
  .rating{display:flex;align-items:center;gap:3px;color:var(--gold);font-weight:700;}
  .chev{color:var(--green-700);flex-shrink:0;}

  /* ---------- Fashion: shops directory ---------- */
  .shops-section-title{font-size:14.5px;font-weight:800;color:var(--green-950);margin:4px 0 12px;}
  .shop-pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
  .shop-tile{
    background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px 6px 11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;font-family:inherit;
    transition:transform .15s ease;
  }
  .shop-tile:active{transform:scale(.95);}
  .shop-badge{
    width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;letter-spacing:.2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px rgba(15,61,36,.14);
  }
  .shop-tile span{font-size:11.5px;font-weight:700;color:var(--green-950);line-height:1.2;}
  .shop-card{
    display:flex;align-items:center;gap:14px;background:var(--white);border:none;width:100%;text-align:left;
    border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,61,36,.07);cursor:pointer;font-family:inherit;
  }
  .shop-card .shop-badge{width:56px;height:56px;border-radius:16px;flex-shrink:0;font-size:15px;}

  /* ---------- Construction: hero header with illustration ---------- */
  .constr-hero{
    position:relative;background:var(--white);border-radius:22px;padding:20px 18px 22px;
    margin-bottom:16px;overflow:hidden;box-shadow:0 6px 18px rgba(15,61,36,.06);
  }
  .constr-hero-art{position:absolute;top:0;right:0;width:64%;height:100%;pointer-events:none;}
  .constr-hero-art svg{position:absolute;top:-6px;right:-10px;width:100%;height:auto;
    -webkit-mask-image:linear-gradient(115deg, transparent 8%, black 52%);
    mask-image:linear-gradient(115deg, transparent 8%, black 52%);}
  .constr-title{position:relative;z-index:1;font-family:'Manrope',sans-serif;font-weight:800;
    font-size:25px;color:#161616;margin:0 0 8px;line-height:1.15;}
  .constr-subtitle{position:relative;z-index:1;font-size:12.5px;color:var(--ink-soft);
    margin:0;line-height:1.5;max-width:64%;}

  /* ---------- Construction: 2-up feature card grid ---------- */
  .constr-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
  .constr-card{
    display:flex;align-items:center;gap:10px;background:var(--white);border:none;text-align:left;
    border-radius:18px;padding:12px;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 16px rgba(15,61,36,.07);transition:transform .15s ease;
  }
  .constr-card:active{transform:scale(.97);}
  .constr-card-ico{
    width:54px;height:54px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#FFC94D,#EF9B1C);overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .constr-card-ico img{width:100%;height:100%;object-fit:cover;}
  .constr-card-ico svg{width:26px;height:26px;}
  .constr-card-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .constr-card-text b{font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:800;color:var(--green-950);line-height:1.22;}
  .constr-card-text em{font-style:normal;font-size:10px;color:var(--ink-soft);line-height:1.25;}
  .constr-card .chev{flex-shrink:0;width:15px;height:15px;}

  /* ---------- Materials banner + post-listing CTA (construction) ---------- */
  .cat-banner{
    width:100%;display:flex;align-items:center;gap:13px;text-align:left;
    background:linear-gradient(135deg,#FBF3E1,#F4FBF6);border:1px solid var(--line);
    border-radius:20px;padding:12px 14px;margin:0 0 12px;cursor:pointer;
    box-shadow:0 6px 18px rgba(15,61,36,.07);transition:transform .15s ease;
  }
  .cat-banner:active{transform:scale(.985);}
  .cat-banner-thumb{
    width:64px;height:64px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:linear-gradient(145deg,#E8A24A,#C9722E);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  }
  .cat-banner-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .cat-banner-info b{font-family:'Manrope',sans-serif;font-size:15px;color:var(--green-950);font-weight:800;}
  .cat-banner-info em{font-style:normal;font-size:11.5px;color:var(--ink-soft);line-height:1.35;}

  .cta-post{
    width:100%;border:none;border-radius:16px;padding:15px;margin-bottom:4px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;color:#fff;letter-spacing:.2px;
    background:linear-gradient(135deg,#F97316,#EA580C);
    box-shadow:0 10px 22px rgba(234,88,12,.35);transition:transform .15s ease;
  }
  .cta-post:active{transform:scale(.98);}
  .cta-post .cta-plus{font-size:21px;font-weight:700;line-height:1;}

  /* ---------- Product grid ---------- */
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
  .product-media{
    height:92px;background:var(--green-100);display:flex;align-items:center;justify-content:center;font-size:30px;
    position:relative;
  }
  .fav-btn{
    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);
    border:none;display:flex;align-items:center;justify-content:center;
  }
  .fav-btn.active svg{fill:#E0455A;stroke:#E0455A;}
  .product-body{padding:10px 10px 12px;}
  .product-body h4{font-size:12.5px;margin:0 0 6px;line-height:1.3;font-weight:600;color:var(--green-950);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;}
  .product-price{font-size:13px;font-weight:800;color:var(--green-700);margin-bottom:8px;}
  .product-body .btn{width:100%;justify-content:center;padding:8px;font-size:12px;}
  .pop-badge{
    position:absolute;top:6px;left:6px;background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;
    font-size:9px;font-weight:800;padding:3px 7px;border-radius:7px;z-index:1;
  }

  /* ---------- Shop home: category sections ---------- */
  .shop-cat-section{margin-bottom:22px;}
  .shop-cat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .shop-cat-head h3{font-size:14.5px;margin:0;color:var(--green-950);font-weight:800;}
  .shop-cat-more{background:none;border:none;font-size:12px;font-weight:700;color:var(--green-700);padding:0;font-family:inherit;flex-shrink:0;}
  .shop-hscroll{
    display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);
    grid-auto-columns:calc((100% - 26px)/2.28);gap:10px;
    overflow-x:auto;overflow-y:hidden;padding-bottom:4px;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  }
  .shop-hscroll::-webkit-scrollbar{display:none;}
  .shop-hscroll .product-card{scroll-snap-align:start;}
  .shop-hscroll .product-media{height:100px;font-size:30px;}
  .shop-hscroll .product-body{padding:9px 9px 11px;}
  .shop-hscroll .product-body h4{font-size:12.5px;margin:0 0 5px;min-height:32px;}
  .shop-hscroll .product-price{font-size:13px;margin-bottom:8px;}
  .shop-hscroll .product-body .btn{padding:8px;font-size:12px;}
  .shop-hscroll .fav-btn{width:26px;height:26px;top:8px;right:8px;}
  .shop-hscroll .pop-badge{font-size:9px;padding:3px 7px;top:7px;left:7px;}

  /* ---------- Shop top banner (16:9, image or video) ---------- */
  .shop-banner{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin-bottom:16px;
    background:linear-gradient(135deg,var(--green-900),var(--green-600));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(15,61,36,.14);
  }
  .shop-banner img, .shop-banner video{width:100%;height:100%;object-fit:cover;display:block;}
  .shop-banner-empty{
    display:flex;flex-direction:column;align-items:center;gap:6px;color:#dff2e6;text-align:center;padding:0 20px;
  }
  .shop-banner-empty b{font-family:'Manrope',sans-serif;font-size:14px;color:#fff;font-weight:800;}
  .shop-banner-empty span{font-size:11px;line-height:1.4;}

  /* ---------- Shop info block ---------- */
  .shop-info{
    background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px;
    box-shadow:0 6px 18px rgba(15,61,36,.06);
  }
  .shop-info-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .shop-info-logo{
    width:56px;height:56px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;background-size:cover;background-position:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }
  .shop-info-main{flex:1;min-width:0;}
  .shop-info-main h3{font-size:16px;margin:0 0 3px;color:var(--green-950);font-weight:800;font-family:'Manrope',sans-serif;}
  .shop-info-stats{font-size:11.5px;color:var(--ink-soft);line-height:1.45;}
  .shop-info-stats .st{color:var(--gold);}
  .shop-info-stats b{color:var(--green-950);font-weight:700;}
  .shop-info-reply{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--green-700);font-weight:600;
    background:var(--green-50);border-radius:10px;padding:8px 10px;margin-bottom:11px;
  }
  .shop-info-since{font-size:11px;color:var(--ink-soft);margin:0 0 11px;}
  .shop-info-actions{display:flex;gap:8px;}
  .shop-info-actions button{
    flex:1;border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-save-shop{background:var(--white);border:1.5px solid var(--green-700);color:var(--green-700);}
  .btn-save-shop.saved{background:var(--green-700);border-color:var(--green-700);color:#fff;}
  .btn-write-seller{background:var(--green-700);border:1.5px solid var(--green-700);color:#fff;}

  /* ---------- Full product page ---------- */
  .pd-photo{
    width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--green-100);
    display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;margin-bottom:14px;
  }
  .pd-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .pd-photo .pd-disc{
    position:absolute;top:12px;left:12px;background:#E0455A;color:#fff;font-size:12px;font-weight:800;
    padding:5px 9px;border-radius:8px;
  }
  .pd-photo .pd-fav{
    position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .pd-photo .pd-fav.active svg{fill:#E0455A;stroke:#E0455A;}
  .pd-brand{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:0 0 4px;}
  .pd-title{font-size:19px;color:var(--green-950);margin:0 0 8px;line-height:1.25;font-family:'Manrope',sans-serif;font-weight:800;}
  .pd-rating{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .pd-rating .st{color:var(--gold);font-size:14px;}
  .pd-rating b{color:var(--green-950);font-weight:800;}
  .pd-prices{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .pd-price{font-size:24px;font-weight:800;color:var(--green-700);font-family:'Manrope',sans-serif;}
  .pd-old{font-size:14px;color:#9aa79f;text-decoration:line-through;font-weight:600;}
  .pd-save{font-size:11.5px;font-weight:700;color:#E0455A;background:#fdecee;border-radius:7px;padding:3px 8px;}
  .pd-block{margin-bottom:16px;}
  .pd-block > h4{font-size:13px;margin:0 0 8px;color:var(--green-950);font-weight:800;}
  .pd-size-chip{
    border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:9px 15px;
    font-size:13px;font-weight:700;color:var(--green-950);font-family:inherit;cursor:pointer;min-width:46px;
  }
  .pd-size-chip.active{background:var(--green-700);color:#fff;border-color:var(--green-700);}
  .pd-specs{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .pd-spec-row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .pd-spec-row:last-child{border-bottom:none;}
  .pd-spec-row span{color:var(--ink-soft);flex-shrink:0;width:44%;}
  .pd-spec-row b{color:var(--green-950);font-weight:600;flex:1;}
  .pd-desc{font-size:13px;line-height:1.6;color:var(--ink);margin:0;}
  .pd-avail{display:flex;flex-direction:column;gap:8px;}
  .pd-avail-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green-950);}
  .pd-avail-row.no{color:var(--ink-soft);}
  .pd-buy-bar{display:flex;gap:8px;margin-bottom:18px;}
  .pd-buy-bar .pd-cart{
    flex:1;background:var(--green-700);color:#fff;border:none;border-radius:13px;padding:14px;
    font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;
  }
  .pd-buy-bar .pd-cart.in{background:var(--green-100);color:var(--green-700);}
  .pd-buy-bar .pd-msg{
    flex-shrink:0;background:var(--white);border:1.5px solid var(--green-700);color:var(--green-700);
    border-radius:13px;padding:14px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }

  /* ---------- In-app chat ---------- */
  .chat-head{
    display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid var(--line);
    border-radius:16px;padding:11px 13px;margin-bottom:12px;
  }
  .chat-head .shop-badge{width:42px;height:42px;border-radius:12px;font-size:13px;flex-shrink:0;}
  .chat-head-info{flex:1;min-width:0;}
  .chat-head-info h3{font-size:14.5px;margin:0 0 2px;color:var(--green-950);font-weight:800;font-family:'Manrope',sans-serif;}
  .chat-head-info p{font-size:11px;color:var(--ink-soft);margin:0;}
  .chat-ctx{
    display:flex;align-items:center;gap:10px;background:var(--green-50);border:1px solid var(--line);
    border-radius:14px;padding:9px;margin-bottom:12px;
  }
  .chat-ctx-thumb{
    width:44px;height:44px;border-radius:10px;flex-shrink:0;background:var(--green-100);background-size:cover;
    background-position:center;display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .chat-ctx-info{flex:1;min-width:0;}
  .chat-ctx-info strong{display:block;font-size:12px;color:var(--green-950);font-weight:700;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .chat-ctx-info span{font-size:11.5px;color:var(--green-700);font-weight:800;}
  .chat-log{
    display:flex;flex-direction:column;gap:8px;min-height:180px;padding:4px 0 10px;
  }
  .chat-day{align-self:center;font-size:10.5px;color:var(--ink-soft);background:var(--green-50);
    padding:4px 11px;border-radius:999px;margin:4px 0;}
  .bubble{
    max-width:80%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.45;position:relative;
    word-wrap:break-word;
  }
  .bubble.me{align-self:flex-end;background:var(--green-700);color:#fff;border-bottom-right-radius:5px;}
  .bubble.them{align-self:flex-start;background:var(--white);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px;}
  .bubble time{display:block;font-size:9.5px;opacity:.65;margin-top:4px;text-align:right;}
  .chat-typing{align-self:flex-start;font-size:11.5px;color:var(--ink-soft);padding:4px 6px;}
  .chat-input-bar{
    position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;background:var(--green-50);
  }
  .chat-input-bar input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:13.5px;
    font-family:inherit;background:var(--white);color:var(--ink);outline:none;
  }
  .chat-send{
    width:42px;height:42px;border-radius:50%;background:var(--green-700);border:none;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .chat-row{
    display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);width:100%;
    border-radius:16px;padding:12px;margin-bottom:10px;text-align:left;font-family:inherit;cursor:pointer;
  }
  .chat-row .shop-badge{width:46px;height:46px;border-radius:13px;font-size:13px;flex-shrink:0;}
  .chat-row-info{flex:1;min-width:0;}
  .chat-row-info strong{display:block;font-size:13.5px;color:var(--green-950);font-weight:700;margin-bottom:2px;}
  .chat-row-info p{font-size:11.5px;color:var(--ink-soft);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-row-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .chat-row-meta time{font-size:10px;color:var(--ink-soft);}
  .chat-unread{
    background:var(--green-700);color:#fff;font-size:10px;font-weight:800;border-radius:999px;
    min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .nav-badge{
    position:absolute;top:-3px;right:calc(50% - 16px);background:#E0455A;color:#fff;font-size:9px;font-weight:800;
    border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  /* ---------- Rich product card (shops) ---------- */
  .sp-card{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .sp-media{
    position:relative;aspect-ratio:1/1;background:var(--green-100);display:flex;align-items:center;justify-content:center;
    font-size:30px;background-size:cover;background-position:center;
  }
  .sp-disc{

  const fmt = n => n.toLocaleString('ru-RU').replace(/,/g,' ') + ' \u20BD';
  const out = {};
  Object.entries(defs).forEach(([cat, items])=>{
    const total = items.length;
    out[cat] = items.map(([name, price, oldPrice, rating, reviews, desc], i)=>[
      name,
      fmt(price),
      {
        photo:null, desc: desc||'', popular:(i%4===0),
        brand: place,
        oldPrice: oldPrice ? fmt(oldPrice) : '',
        discount: oldPrice ? Math.round((1 - price/oldPrice)*100) : 0,
        rating, reviews,
        sizes:[], sizesAll:[], color:'',
        category: cat,
        gender:'Унисекс', material:'', season:'Всесезон', style:'', country:'Россия',
        condition:'Новое', inStock:(i%11!==7), delivery:true, pickup:true,
        added: total - i
      }
    ]);
  });
  return out;
}

/* ===================== HELPERS ===================== */
function $(sel,root=document){return root.querySelector(sel);}
function $all(sel,root=document){return [...root.querySelectorAll(sel)];}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2400);
}
function catById(id){return DATA.find(c=>c.id===id);}
function showScreen(name){
  $all('.screen').forEach(s=>s.classList.remove('active'));
  $(`.screen[data-screen="${name}"]`).classList.add('active');
  const hideSearch = name==='category' || (name==='provider' && state.activeCat!=='realty') || name==='detail'
    || name==='product' || name==='vendor' || name==='admin';
  $('#appShell').classList.toggle('hide-top-search', hideSearch);
  const mainArea = $('#mainArea');
  if(mainArea) mainArea.scrollTop = 0;
  window.scrollTo({top:0,behavior:'instant'});
}
function star(){return '★';}
function pseudoCount(seed, min, max){
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  return min + (h % (max - min));
}
function parsePrice(str){
  const m = String(str).match(/\d[\d\s]*/);
  if(!m) return null;
  return parseInt(m[0].replace(/\s/g,''), 10);
}
function passesPriceFilter(priceStr, catId){
  const f = state.catFilters[catId];
  if(!f) return true;
  const val = parsePrice(priceStr);
  if(val===null) return true;
  if(f.priceFrom && val < Number(f.priceFrom)) return false;
  if(f.priceTo && val > Number(f.priceTo)) return false;
  return true;
}
function applySortFilter(list, catId, getPrice){
  const f = state.catFilters[catId];
  if(!f || !f.sort || f.sort==='default') return list;
  const dir = f.sort==='asc' ? 1 : -1;
  return [...list].sort((a,b)=>{
    const pa = parsePrice(getPrice(a)), pb = parsePrice(getPrice(b));
    if(pa===null && pb===null) return 0;
    if(pa===null) return 1;
    if(pb===null) return -1;
    return (pa-pb)*dir;
  });
}
function openProductFiltersModal(cat){
  const f = state.catFilters[cat.id] || {};
  openModal(`
    <div class="modal-head"><h3>Фильтры</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field-group"><label>Цена от</label><input type="number" id="pfFrom" value="${f.priceFrom||''}" placeholder="Например: 1000"></div>
    <div class="field-group"><label>Цена до</label><input type="number" id="pfTo" value="${f.priceTo||''}" placeholder="Например: 50000"></div>
    <div class="field-group"><label>Сортировка</label>
      <select id="pfSort">
        <option value="default" ${(!f.sort||f.sort==='default')?'selected':''}>По умолчанию</option>
        <option value="asc" ${f.sort==='asc'?'selected':''}>Сначала дешевле</option>
        <option value="desc" ${f.sort==='desc'?'selected':''}>Сначала дороже</option>
      </select>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" id="pfApplyBtn">Показать</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center" id="pfResetBtn">Сбросить фильтры</button>
  `);
  $('#pfApplyBtn').onclick=()=>{
    state.catFilters[cat.id] = { priceFrom: $('#pfFrom').value, priceTo: $('#pfTo').value, sort: $('#pfSort').value };
    closeModal();
    renderProviderProducts(cat);
  };
  $('#pfResetBtn').onclick=()=>{
    delete state.catFilters[cat.id];
    closeModal();
    renderProviderProducts(cat);
  };
}

function translit(str){
  const map={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',
    н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',
    ь:'',э:'e',ю:'yu',я:'ya'};
  return str.toLowerCase().split('').map(ch=>map[ch]!==undefined?map[ch]:ch).join('');
}
const METRO_LIST = [...new Set(METRO_RAW)].map(name=>({name, tr:translit(name)}));

function renderMetroSuggestions(q){
  const box = $('#metroSuggestions');
  if(!q){ box.innerHTML=''; box.classList.remove('open'); return; }
  const query = q.toLowerCase().trim();
  const matches = METRO_LIST.filter(m=>{
    if(state.selectedMetro.includes(m.name)) return false;
    return m.name.toLowerCase().startsWith(query) || m.tr.startsWith(query);
  }).slice(0,6);
  if(!matches.length){
    box.innerHTML = '<div class="metro-empty">Станция не найдена</div>';
    box.classList.add('open');
    return;
  }
  box.innerHTML = matches.map(m=>`<button class="metro-suggest-item" data-name="${m.name}">🚇 ${m.name}</button>`).join('');
  box.classList.add('open');
  $all('.metro-suggest-item', box).forEach(btn=>btn.onclick=()=>addMetro(btn.dataset.name));
}
function addMetro(name){
  if(!state.selectedMetro.includes(name)) state.selectedMetro.push(name);
  const input = $('#metroInput');
  input.value=''; input.focus();
  renderMetroSuggestions('');
  renderMetroChips();
  toast(`Добавлено: ${name}`);
}
function removeMetro(name){
  state.selectedMetro = state.selectedMetro.filter(n=>n!==name);
  renderMetroChips();
}
function renderMetroChips(){
  const box = $('#metroChips');
  box.innerHTML = state.selectedMetro.map(n=>`<span class="metro-chip">🚇 ${n}<button data-remove="${n}" aria-label="Убрать">✕</button></span>`).join('');
  $all('[data-remove]', box).forEach(b=>b.onclick=()=>removeMetro(b.dataset.remove));
}
function initMetroSearch(){
  const input = $('#metroInput');
  input.addEventListener('input', e=>renderMetroSuggestions(e.target.value));
  input.addEventListener('focus', e=>{ if(e.target.value.trim()) renderMetroSuggestions(e.target.value); });
  document.addEventListener('click', e=>{
    if(!e.target.closest('#metroSearchBar')) $('#metroSuggestions').classList.remove('open');
  });
  renderMetroChips();
}

function openListingDetail(item, related, backScreen){
  state.detailBack = backScreen || 'home';
  const el = $('#screenDetail');
  const title = item.title || item.tag || 'Объявление';
  const thumbs = item.photo ? [item.photo, item.photo+'-b', item.photo+'-c', item.photo+'-d'] : [];
  el.innerHTML = `
    <div class="back-row" style="padding:14px 16px 0">
      <button class="back-btn" id="backFromDetail"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F3D24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div><h2 class="screen-title">Объявление</h2></div>
    </div>
    <div class="detail-media" id="detailMedia">
      ${thumbs.length ? `
        <div class="detail-slider" id="detailSlider">
          ${thumbs.map(p=>`<div class="detail-slide" style="background-image:url('https://picsum.photos/seed/${p}/800/650')"></div>`).join('')}
        </div>
        <button class="detail-arrow prev" id="detailPrev" aria-label="Предыдущее фото">‹</button>
        <button class="detail-arrow next" id="detailNext" aria-label="Следующее фото">›</button>
        <span class="detail-counter" id="detailCounter">1 / ${thumbs.length}</span>
        <span class="detail-zoom-hint">🔍 Нажмите, чтобы увеличить</span>
      ` : ''}
    </div>
    ${thumbs.length?`<div class="detail-thumbs">
      ${thumbs.map((p,i)=>`<div class="detail-thumb ${i===0?'active':''}" data-photo="${p}" style="background-image:url('https://picsum.photos/seed/${p}/120/120')"></div>`).join('')}
    </div>`:''}
    <div style="padding:0 16px">
      <h3 class="detail-title">${title}</h3>
      ${item.desc?`<p class="detail-desc">${item.desc}</p>`:''}
      <div class="detail-price-row"><b>${item.price}</b>${item.old?`<s>${item.old}</s>`:''}</div>
      <div class="detail-meta"><span>📍 Москва</span><span>Сегодня</span></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="detailContactBtn">Показать контакты</button>
      ${item.user?`<div class="detail-seller"><span class="avatar-circle">${item.user[0]}</span><div><strong>${item.user}</strong><span>Продавец</span></div></div>`:''}
      <p style="font-size:11.5px;color:var(--ink-soft);margin:14px 0 0;text-align:center">👁 ${pseudoCount(item.key||title, 18, 480)} просмотров объявления</p>
    </div>
    <div class="section-head" style="margin:22px 16px 12px"><h2 style="font-size:16px">Похожие объявления</h2></div>
    <div class="listings-grid" id="relatedListings" style="padding:0 16px 10px"></div>
  `;
  $('#backFromDetail').onclick=()=>showScreen(state.detailBack);
  $('#detailContactBtn').onclick=()=>openContactModal(title);
  let activePhotoIdx = 0;
  const slider = $('#detailSlider');
  const syncGallery = (i)=>{
    activePhotoIdx = i;
    const cnt = $('#detailCounter');
    if(cnt) cnt.textContent = `${i+1} / ${thumbs.length}`;
    $all('#screenDetail .detail-thumb').forEach((x,j)=>x.classList.toggle('active', j===i));
  };
  const goToPhoto = (i)=>{
    if(!slider) return;
    const idx = (i + thumbs.length) % thumbs.length;
    slider.scrollTo({left: slider.clientWidth * idx, behavior:'smooth'});
    syncGallery(idx);
  };
  $all('#screenDetail .detail-thumb').forEach((t,i)=>{ t.onclick=()=>goToPhoto(i); });
  if(slider){
    slider.addEventListener('scroll', ()=>{
      const i = Math.round(slider.scrollLeft / slider.clientWidth);
      if(i !== activePhotoIdx) syncGallery(i);
    });
    $all('#screenDetail .detail-slide').forEach((s,i)=>{
      s.onclick = ()=>openPhotoViewer(thumbs, i);
    });
    $('#detailPrev').onclick = (e)=>{ e.stopPropagation(); goToPhoto(activePhotoIdx-1); };
    $('#detailNext').onclick = (e)=>{ e.stopPropagation(); goToPhoto(activePhotoIdx+1); };
  }
  $('#relatedListings').innerHTML = related.slice(0,6).map(miniListingCard).join('');
  $all('#relatedListings .listing-card').forEach(card=>{
    card.onclick=()=>{
      const key = card.dataset.detailKey;
      const found = related.find(r=>r.key===key);
      if(found) openListingDetail(found, related.filter(r=>r.key!==key), state.detailBack);
    };
  });
  $all('#relatedListings [data-fav]').forEach(h=>{
    h.onclick=(e)=>{
      e.stopPropagation();
      const key=h.dataset.fav;
      if(state.favorites.has(key)){state.favorites.delete(key); h.textContent='🤍';}
      else {state.favorites.add(key); h.textContent='❤️'; toast('Добавлено в избранное');}
    };
  });
  showScreen('detail');
}

/* ===================== FULLSCREEN PHOTO VIEWER ===================== */
const photoViewerState = { photos:[], idx:0 };
function openPhotoViewer(photos, startIdx){
  photoViewerState.photos = photos;
  photoViewerState.idx = startIdx || 0;
  renderPhotoViewer();
  $('#photoViewer').classList.add('open');
}
function closePhotoViewer(){ $('#photoViewer').classList.remove('open'); }
function renderPhotoViewer(){
  const {photos, idx} = photoViewerState;
  const img = $('#photoViewerImg');
  img.style.backgroundImage = `url('https://picsum.photos/seed/${photos[idx]}/1200/1200')`;
  $('#photoViewerDots').innerHTML = photos.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join('');
  const cnt = $('#photoViewerCounter');
  if(cnt) cnt.textContent = `${idx+1} / ${photos.length}`;
  setPhotoZoom(1);
}
function setPhotoZoom(z){
  photoViewerState.zoom = Math.min(4, Math.max(1, z));
  const img = $('#photoViewerImg');
  img.style.transform = `scale(${photoViewerState.zoom})`;
  img.classList.toggle('zoomed', photoViewerState.zoom > 1);
}
function photoViewerPrev(){
  photoViewerState.idx = (photoViewerState.idx - 1 + photoViewerState.photos.length) % photoViewerState.photos.length;
  renderPhotoViewer();
}
function photoViewerNext(){
  photoViewerState.idx = (photoViewerState.idx + 1) % photoViewerState.photos.length;
  renderPhotoViewer();
}
$('#photoViewerClose').onclick = closePhotoViewer;
$('#photoViewerPrev').onclick = (e)=>{ e.stopPropagation(); photoViewerPrev(); };
$('#photoViewerNext').onclick = (e)=>{ e.stopPropagation(); photoViewerNext(); };
$('#photoZoomIn').onclick = (e)=>{ e.stopPropagation(); setPhotoZoom((photoViewerState.zoom||1) + 0.5); };
$('#photoZoomOut').onclick = (e)=>{ e.stopPropagation(); setPhotoZoom((photoViewerState.zoom||1) - 0.5); };
$('#photoViewerImg').onclick = (e)=>{
  e.stopPropagation();
  setPhotoZoom((photoViewerState.zoom||1) > 1 ? 1 : 2.2);
};
$('#photoViewerImg').addEventListener('dblclick', e=>{
  e.stopPropagation();
  setPhotoZoom((photoViewerState.zoom||1) > 1 ? 1 : 3);
});
document.addEventListener('keydown', e=>{
  if(!$('#photoViewer').classList.contains('open')) return;
  if(e.key==='ArrowLeft') photoViewerPrev();
  if(e.key==='ArrowRight') photoViewerNext();
  if(e.key==='Escape') closePhotoViewer();
  if(e.key==='+' || e.key==='=') setPhotoZoom((photoViewerState.zoom||1)+0.5);
  if(e.key==='-') setPhotoZoom((photoViewerState.zoom||1)-0.5);
});
$('#photoViewer').addEventListener('click', e=>{ if(e.target.id==='photoViewer') closePhotoViewer(); });
(function(){
  let touchStartX = null;
  const img = $('#photoViewerImg');
  img.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
  img.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ dx < 0 ? photoViewerNext() : photoViewerPrev(); }
    touchStartX = null;
  });
})();

function buildCatSearchIndex(cat){
  const idx = [];
  cat.subcats.forEach(s=>{
    idx.push({kind:'sub', label:s, sub:s});
    if(cat.listings && cat.listings[s]){
      cat.listings[s].forEach(l=>idx.push({kind:'item', label:l.title, price:l.price, sub:s}));
    } else if(cat.catalog && cat.catalog[s]){
      cat.catalog[s].forEach(it=>idx.push({kind:'item', label:it[0], price:it[1], sub:s}));
    }
  });
  return idx;
}
function renderCatSearchSuggestions(cat, query){
  const box = $('#catSearchSuggestions');
  if(!box) return;
  const q = query.trim().toLowerCase();
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const matches = buildCatSearchIndex(cat).filter(e=>e.label.toLowerCase().includes(q)).slice(0,8);
  box.innerHTML = matches.length ? matches.map((e,i)=>`
    <button type="button" class="cat-search-suggest-item" data-idx="${i}">
      <span class="css-name">${e.kind==='sub' ? '📂' : ((cat.subIcons&&cat.subIcons[e.sub])||cat.icon)} ${e.label}</span>
      ${e.kind==='item' ? `<span class="css-price">${e.price}</span>` : `<span class="css-sub">${(cat.subDesc&&cat.subDesc[e.sub])||''}</span>`}
    </button>`).join('') : `<div class="cat-search-empty">Ничего не найдено по «${query}»</div>`;
  box.classList.add('open');
  $all('#catSearchSuggestions .cat-search-suggest-item').forEach((btn,i)=>{
    btn.onclick=()=>openSubcat(cat.id, matches[i].sub);
  });
}
function wireCatSearch(cat){
  const input = $('#catSearchInput');
  const box = $('#catSearchSuggestions');
  if(!input) return;
  input.addEventListener('input', e=>renderCatSearchSuggestions(cat, e.target.value));
  input.addEventListener('focus', e=>{ if(e.target.value.trim()) renderCatSearchSuggestions(cat, e.target.value); });
  input.addEventListener('blur', ()=>setTimeout(()=>{ if(box) box.classList.remove('open'); }, 150));
}

/* ===================== SHOP FILTERS & SORT ===================== */
state.shopSort = 'popular';
function emptyShopFilters(){
  return {
    category:'', gender:'', brand:'', condition:'', material:'', season:'', style:'', country:'',
    priceFrom:'', priceTo:'',
    sizes:new Set(), colors:new Set(),
    inStock:false, discountOnly:false, delivery:false, pickup:false
  };
}
state.shopFilters = emptyShopFilters();
function shopFilterCount(){
  const f = state.shopFilters;
  let n = 0;
  ['category','gender','brand','condition','material','season','style','country','priceFrom','priceTo'].forEach(k=>{ if(f[k]) n++; });
  n += f.sizes.size + f.colors.size;
  ['inStock','discountOnly','delivery','pickup'].forEach(k=>{ if(f[k]) n++; });
  return n;
}
function priceNum(s){ const n = parseInt(String(s).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
function passesShopFilters(meta, price, sub){
  const f = state.shopFilters;
  if(f.category && sub !== f.category) return false;
  if(f.gender && meta.gender !== f.gender) return false;
  if(f.brand && meta.brand !== f.brand) return false;
  if(f.condition && meta.condition !== f.condition) return false;
  if(f.material && meta.material !== f.material) return false;
  if(f.season && meta.season !== f.season) return false;
  if(f.style && meta.style !== f.style) return false;
  if(f.country && meta.country !== f.country) return false;
  const p = priceNum(price);
  if(f.priceFrom && p < Number(f.priceFrom)) return false;
  if(f.priceTo && p > Number(f.priceTo)) return false;
  if(f.sizes.size){
    const all = meta.sizesAll || meta.sizes || [];
    if(![...f.sizes].some(s=>all.includes(s))) return false;
  }
  if(f.colors.size && !f.colors.has(meta.color)) return false;
  if(f.inStock && !meta.inStock) return false;
  if(f.discountOnly && !meta.discount) return false;
  if(f.delivery && !meta.delivery) return false;
  if(f.pickup && !meta.pickup) return false;
  return true;
}
function sortShopItems(items){
  const s = state.shopSort;
  const arr = [...items];
  if(s==='cheap') arr.sort((a,b)=>priceNum(a.price)-priceNum(b.price));
  else if(s==='expensive') arr.sort((a,b)=>priceNum(b.price)-priceNum(a.price));
  else if(s==='discount') arr.sort((a,b)=>(b.meta.discount||0)-(a.meta.discount||0));
  else if(s==='rating') arr.sort((a,b)=>(b.meta.rating||0)-(a.meta.rating||0));
  else if(s==='new') arr.sort((a,b)=>(b.meta.added||0)-(a.meta.added||0));
  else arr.sort((a,b)=>((b.meta.popular?1:0)-(a.meta.popular?1:0)) || ((b.meta.reviews||0)-(a.meta.reviews||0)));
  return arr;
}
function collectShopItems(shop, onlySub){
  const q = (state.subcatQuery||'').trim().toLowerCase();
  const subs = onlySub ? [onlySub] : shop.subcats;
  const out = [];
  subs.forEach(sub=>{
    (shop.catalog[sub]||[]).forEach((it,i)=>{
      const meta = it[2]||{};
      if(q && !it[0].toLowerCase().includes(q)) return;
      if(!passesShopFilters(meta, it[1], sub)) return;
      out.push({sub, idx:i, name:it[0], price:it[1], meta});
    });
  });
  return out;
}

function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if(n10===1 && n100!==11) return one;
  if(n10>=2 && n10<=4 && (n100<10 || n100>=20)) return few;
  return many;
}

function renderProviderProducts(cat){
  const subs = state.activeChip==='Все' ? cat.subcats : [state.activeChip];
  if(cat.taxiParks && state.activeChip==='Такси'){
    renderTaxiParks(cat);
    return;
  }
  if(cat.listings){
    renderListingRows(cat, subs);
    return;
  }
  if(cat.id==='construction' && state.activeChip!=='Строительные материалы'){
    renderConstructionRows(cat, subs);
    return;
  }
  let entries = [];
  subs.forEach(s=>{ (cat.catalog[s]||[]).forEach((it,i)=>entries.push({sub:s,name:it[0],price:it[1],idx:i})); });
  const pq = (state.subcatQuery||'').trim().toLowerCase();
  if(pq) entries = entries.filter(e=>e.name.toLowerCase().includes(pq));
  entries = entries.filter(e=>passesPriceFilter(e.price, cat.id));
  entries = applySortFilter(entries, cat.id, e=>e.price);
  $('#providerProducts').className = 'product-grid';
  $('#providerProducts').innerHTML = entries.length
    ? entries.map(e=>productCard(cat.icon, e.name, e.price, `${cat.id}-${e.sub}-${e.idx}`)).join('')
    : `<p style="grid-column:1/-1;color:var(--ink-soft);font-size:13px;text-align:center;margin-top:10px">Ничего не найдено по вашим фильтрам</p>`;
  bindProductCards();
}
function constructionRowMeta(sub, name, price, i){
  const seed = (name.length + i*7) % 4;
  const cities = ['Москва','Московская область','Москва','Химки'];
  const orgs = {
    'Ищу работу':['Частное лицо','Специалист','Частное лицо','Мастер'],
    'Ищу работников':['СтройМастер','РосСтройКонтракт','РемонтПро','ЖК «Северный»'],
    'Бригады':['Бригада 6 чел.','Бригада 8 чел.','Бригада 12 чел.','Бригада 4 чел.'],
    'Заказы на субподряд':['ГК «Монолит»','СтройИнвест','РосСтройКонтракт','ДСК-7'],
    'Подработка':['Частное лицо','Склад №4','Частное лицо','Магазин'],
    'Спецтехника':['СпецТехАренда','ТехПарк','АвтоКран-М','СтройТех']
  };
  const extra = {
    'Ищу работу':['Опыт 5 лет','Готов к переезду','Опыт 3 года','Есть инструмент'],
    'Ищу работников':['Вахта','Полный день','Проживание','Оплата еженедельно'],
    'Бригады':['Свой инструмент','Опыт 7 лет','Работаем по России','Готовы сразу'],
    'Заказы на субподряд':['Объём 2 000 м²','Срок 3 мес.','С документами','Аванс 30%'],
    'Подработка':['Оплата в тот же день','Сегодня','На 2 дня','Без опыта'],
    'Спецтехника':['С водителем','От 4 часов','Выезд по области','Работаем 24/7']
  };
  return {
    org: (orgs[sub]||['Частное лицо'])[seed % (orgs[sub]||['x']).length],
    city: cities[seed],
    extra: (extra[sub]||['Договорная'])[seed % (extra[sub]||['x']).length]
  };
}
function renderConstructionRows(cat, subs){
  let rows = [];
  subs.forEach(s=>{
    (cat.catalog[s]||[]).forEach((it,i)=>rows.push({sub:s, name:it[0], price:it[1], idx:i}));
  });
  const pq = (state.subcatQuery||'').trim().toLowerCase();
  if(pq) rows = rows.filter(r=>r.name.toLowerCase().includes(pq));
  rows = rows.filter(r=>passesPriceFilter(r.price, cat.id));
  rows = applySortFilter(rows, cat.id, r=>r.price);
  const box = $('#providerProducts');
  box.className = '';
  box.innerHTML = rows.length ? rows.map((r,n)=>{
    const key = `${cat.id}-${r.sub}-${r.idx}`;
    const m = constructionRowMeta(r.sub, r.name, r.price, r.idx);
    const isTop = (r.idx % 3 === 1);
    const tile = cat.tiles && cat.tiles[r.sub];
    const ico = tile && tile.svg ? tile.svg : (cat.subIcons && cat.subIcons[r.sub]) || '🏗️';
    const highlight = isTop ? 'background:var(--gold-100);border:1px solid var(--gold);box-shadow:none;' : '';
    return `
    <div class="provider-card" data-constr="${key}" style="align-items:flex-start;${highlight}">
      <div class="provider-thumb" style="display:flex;align-items:center;justify-content:center">${ico}</div>
      <div class="provider-info">
        ${isTop?'<span style="background:var(--green-700);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-bottom:4px;display:inline-block">ТОП</span>':''}
        <h3>${r.name}</h3>
        <p>${m.org} · ${m.city}</p>
        <p style="color:var(--green-700);font-weight:700;margin-top:3px;font-size:13px">${r.price}</p>
        <div class="provider-meta" style="margin-top:4px"><span>${r.sub}</span><span>·</span><span>${m.extra}</span></div>
      </div>
      <span class="heart" data-fav="${key}" style="margin-left:8px;flex-shrink:0">${state.favorites.has(key)?'❤️':'🤍'}</span>
    </div>`;
  }).join('') : `<p style="color:var(--ink-soft);font-size:13px;text-align:center;margin-top:10px">Ничего не найдено по вашим фильтрам</p>`;
  $all('#providerProducts [data-constr]').forEach(card=>{
    card.onclick=(e)=>{
      if(e.target.closest('[data-fav]')) return;
      const name = card.querySelector('h3').textContent;
      openContactModal(name);
    };
  });
  $all('#providerProducts [data-fav]').forEach(h=>{
    h.onclick=(e)=>{
      e.stopPropagation();
      const k = h.dataset.fav;
      if(state.favorites.has(k)){ state.favorites.delete(k); h.textContent='🤍'; }
      else { state.favorites.add(k); h.textContent='❤️'; toast('Добавлено в избранное'); }
    };
  });
}
function renderTaxiParks(cat){
  const box = $('#providerProducts');
  box.className = 'grid-cats';
  const tq = (state.subcatQuery||'').trim().toLowerCase();
  const parks = tq ? cat.taxiParks.filter(n=>n.toLowerCase().includes(tq)) : cat.taxiParks;
  box.innerHTML = parks.map(name=>`
    <div class="cat-card" data-contact="${name}">
      <span class="ico">🚕</span>
      <span>${name}</span>
    </div>`).join('');
  $all('#providerProducts .cat-card').forEach(card=>{
    card.onclick=()=>openContactModal(card.dataset.contact);
  });
}
function renderListingRows(cat, subs){
  let rows = [];
  subs.forEach(s=>{
    const items = cat.listings[s];
    if(items){
      items.forEach((l,i)=>rows.push({...l, sub:s, idx:i}));
    } else {
      (cat.catalog[s]||[]).forEach((it,i)=>rows.push({title:it[0], price:it[1], desc:'', old:'', user:'', sub:s, idx:i}));
    }
  });
  rows.forEach(r=>{ r.key = `${cat.id}-${r.sub}-${r.idx}`; });
  const rq = (state.subcatQuery||'').trim().toLowerCase();
  if(rq) rows = rows.filter(r=>(r.title||'').toLowerCase().includes(rq));
  rows = rows.filter(r=>passesPriceFilter(r.price, cat.id));
  rows = applySortFilter(rows, cat.id, r=>r.price);
  const box = $('#providerProducts');
  box.className = 'listing-row-list';
  if(!rows.length){
    box.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;text-align:center;margin-top:10px">Ничего не найдено по вашим фильтрам</p>`;
    return;
  }
  box.innerHTML = rows.map(r=>{
    const fav = state.favorites.has(r.key) ? '❤️' : '🤍';
    const mediaStyle = r.photo ? `style="background-image:url('https://picsum.photos/seed/${r.photo}/200/200')"` : '';
    return `
    <div class="listing-row-card" data-key="${r.key}">
      <div class="listing-row-media" ${mediaStyle}>${r.photo?'':cat.icon}</div>
      <div class="listing-row-body">
        ${r.desc?`<p class="listing-desc">${r.desc}</p>`:''}
        <h4>${r.title}</h4>
        <div class="listing-price"><b>${r.price}</b>${r.old?`<s>${r.old}</s>`:''}</div>
        <div class="listing-footer">
          ${r.user?`<span class="avatar-circle-sm">${r.user[0]}</span><span>${r.user}</span>`:''}
          <span class="listing-row-actions">
            <span class="msg-ico" data-contact="${r.title}">✉️</span>
            <span class="heart" data-fav="${r.key}">${fav}</span>
          </span>
        </div>
      </div>
    </div>`;
  }).join('');
  $all('#providerProducts .listing-row-card').forEach(card=>{
    card.onclick=()=>{
      const found = rows.find(r=>r.key===card.dataset.key);
      if(found) openListingDetail(found, rows.filter(r=>r.key!==found.key), 'provider');
    };
  });
  $all('#providerProducts [data-contact]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openContactModal(b.dataset.contact);});
  $all('#providerProducts [data-fav]').forEach(h=>{
    h.onclick=(e)=>{
      e.stopPropagation();
      const key=h.dataset.fav;
      if(state.favorites.has(key)){state.favorites.delete(key); h.textContent='🤍';}
      else {state.favorites.add(key); h.textContent='❤️'; toast('Добавлено в избранное');}
    };
  });
}
function productCard(icon,name,price,key){
  const fav = state.favorites.has(key) ? 'active' : '';
  return `
  <div class="product-card">
    <div class="product-media">${icon}
      <button class="fav-btn ${fav}" data-fav="${key}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4B5D53" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
    </div>
    <div class="product-body">
      <h4>${name}</h4>
      <div class="product-price">${price}</div>
      <button class="btn btn-primary" data-contact="${name}">Написать</button>
    </div>
  </div>`;
}
function bindProductCards(){
  $all('[data-open-product]').forEach(card=>{
    card.onclick=(e)=>{
      if(e.target.closest('[data-fav]') || e.target.closest('[data-cart]')) return;
      const [shopId, sub, idx] = card.dataset.openProduct.split('|');
      state.pickedSize = null;
      openProductPage(shopId, sub, +idx);
    };
  });
  $all('[data-cart]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const key=b.dataset.cart;
      if(state.cart.has(key)){
        state.cart.delete(key);
        b.classList.remove('in'); b.textContent='В корзину';
        toast('Удалено из корзины');
      } else {
        state.cart.add(key);
        b.classList.add('in'); b.textContent='✓ В корзине';
        toast(`В корзине товаров: ${state.cart.size}`);
      }
    };
  });
  $all('[data-fav]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const key=b.dataset.fav;
      if(state.favorites.has(key)){state.favorites.delete(key); b.classList.remove('active');}
      else {state.favorites.add(key); b.classList.add('active'); toast('Добавлено в избранное');}
    };
  });
  $all('[data-contact]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      openContactModal(b.dataset.contact);
    };
  });
}

function flattenSearchIndex(){
  const idx=[];
  DATA.forEach(c=>{
    if(!c.hidden) idx.push({type:'Категория',icon:c.icon,name:c.name,go:()=>openCategory(c.id)});
    if(c.shops){
      c.shops.forEach(shop=>{
        idx.push({type:c.name,icon:c.icon,name:shop.name,go:()=>{closeSearch();openShop(c.id,shop.id);}});
        Object.entries(shop.catalog||{}).forEach(([sub,items])=>items.forEach(it=>{
          idx.push({type:`${shop.name} · ${sub}`,icon:c.icon,name:it[0]+' — '+it[1],go:()=>{closeSearch();openShop(c.id,shop.id);}});
        }));
      });
      return;
    }
    (c.providers||[]).forEach((p,i)=>idx.push({type:c.name,icon:c.icon,name:p.name,go:()=>{closeSearch();openProvider(c.id,i);}}));
    Object.entries(c.catalog||{}).forEach(([sub,items])=>items.forEach(it=>{
      idx.push({type:`${c.name} · ${sub}`,icon:c.icon,name:it[0]+' — '+it[1],go:()=>{closeSearch();openCategory(c.id);}});
    }));
  });
  return idx;
}
const SEARCH_INDEX = flattenSearchIndex();

function renderMetroSearchBody(query){
  const body = $('#searchBody');
  const q = query.toLowerCase().trim();
  const list = q
    ? METRO_LIST.filter(m=>m.name.toLowerCase().startsWith(q) || m.tr.startsWith(q)).slice(0,8)
    : METRO_LIST.slice(0,6);
  body.innerHTML = `
    <div class="section-head" style="margin-top:4px"><h2 style="font-size:14px">${q?'Станции':'Популярные станции'}</h2></div>
    ${list.length ? list.map(m=>`
      <div class="search-result-row" data-metro="${m.name}">
        <div class="ico">🚇</div><div><strong>${m.name}</strong><span>Станция метро</span></div>
      </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13px;margin-top:20px;text-align:center">Станция не найдена</p>`}
  `;
  $all('[data-metro]').forEach(row=>row.onclick=()=>renderMetroResults(row.dataset.metro));
}

function renderSearchBody(query){
  const body = $('#searchBody');
  if(!query){
    body.innerHTML = `
      ${state.recent.length? `<div class="section-head" style="margin-top:4px"><h2 style="font-size:14px">Недавние поиски</h2><span class="link" id="clearRecent">Очистить</span></div>
      <div class="recent-chip-row">${state.recent.map(r=>`<span class="chip" data-recent="${r}">${r}</span>`).join('')}</div>` : ''}
      <div class="section-head" style="margin-top:18px"><h2 style="font-size:14px">Популярные категории</h2></div>
      ${DATA.slice(0,5).map(c=>`
        <div class="search-result-row" data-goto-cat="${c.id}">
          <div class="ico">${c.icon}</div><div><strong>${c.name}</strong><span>${c.tag}</span></div>
        </div>`).join('')}
    `;
    $('#clearRecent') && ($('#clearRecent').onclick=()=>{state.recent=[]; renderSearchBody('');});
    $all('[data-recent]').forEach(c=>c.onclick=()=>{$('#searchInput').value=c.dataset.recent; renderSearchBody(c.dataset.recent);});
    $all('[data-goto-cat]').forEach(c=>c.onclick=()=>{closeSearch(); openCategory(c.dataset.gotoCat);});
    return;
  }
  const q=query.toLowerCase();
  const results = SEARCH_INDEX.filter(r=>r.name.toLowerCase().includes(q)).slice(0,20);
  body.innerHTML = results.length ? results.map((r,i)=>`
    <div class="search-result-row" data-res="${i}">
      <div class="ico">${r.icon}</div><div><strong>${r.name}</strong><span>${r.type}</span></div>
    </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13px;margin-top:20px;text-align:center">Ничего не найдено по «${query}»</p>`;
  $all('[data-res]').forEach(el=>{
    el.onclick=()=>{
      if(!state.recent.includes(query)){ state.recent.unshift(query); state.recent=state.recent.slice(0,6); }
      results[+el.dataset.res].go();
    };
  });
}

/* ===================== IN-APP CHAT (клиент <-> продавец) ===================== */
state.shopChats = {};
state.chatCtx = null;
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function findShopById(shopId){
  for(const c of DATA){
    if(!c.shops) continue;
    const s = c.shops.find(x=>x.id===shopId);
    if(s) return {shop:s, catId:c.id};
  }
  return null;
}
function ensureShopChat(shopId){
  if(!state.shopChats[shopId]){
    const found = findShopById(shopId);
    state.shopChats[shopId] = {
      shopId,
      messages:[{from:'them', text:`Здравствуйте! Это ${found?found.shop.name:'магазин'}. Чем можем помочь?`, time:nowTime()}],
      unread:0
    };
  }
  return state.shopChats[shopId];
}
function totalUnread(){
  return Object.values(state.shopChats).reduce((n,c)=>n+(c.unread||0),0);
}
function updateChatsBadge(){
  const b = $('#chatsBadge');
  if(!b) return;
  const n = totalUnread();
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n;
}
function openShopChat(shopId, ctx){
  const found = findShopById(shopId);
  if(!found){ toast('Магазин не найден'); return; }
  ensureShopChat(shopId);
  state.shopChats[shopId].unread = 0;
  state.chatCtx = ctx || null;
  state.activeChatShop = shopId;
  updateChatsBadge();
  renderChatScreen();
  showScreen('chat');
}
function renderChatScreen(){
  const shopId = state.activeChatShop;
  const {shop} = findShopById(shopId);
  const chat = ensureShopChat(shopId);
  const ctx = state.chatCtx;
  const el = $('#screenChat');
  el.innerHTML = `
    <div class="back-row" style="margin-bottom:10px">
      <button class="back-btn" id="backFromChat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F3D24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <p class="screen-sub">Чат с продавцом</p>
    </div>
    <div class="chat-head">
      <span class="shop-badge" style="${shop.logo?`background-image:url('${shop.logo}');background-size:cover`:`background:${shop.color}`}">${shop.logo?'':shop.initials}</span>
      <div class="chat-head-info">
        <h3>${shop.name}</h3>
        <p>★ ${String(shop.rating).replace('.',',')} · обычно отвечает в течение ${shop.reply}</p>
      </div>
    </div>
    ${ctx ? `
      <div class="chat-ctx">
        <div class="chat-ctx-thumb" ${ctx.photo?`style="background-image:url('${ctx.photo}')"`:''}>${ctx.photo?'':'🛍️'}</div>
        <div class="chat-ctx-info">
          <strong>${ctx.name}</strong>
          <span>${ctx.price||''}</span>
        </div>
      </div>` : ''}
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-bar">
      <input type="text" id="chatInputField" placeholder="Написать сообщение…" autocomplete="off">
      <button class="chat-send" id="chatSendBtn" aria-label="Отправить">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l16-8-6 8 6 8z"/></svg>
      </button>
    </div>
  `;
  $('#backFromChat').onclick=()=>openChatsList();
  const send = ()=>{
    const input = $('#chatInputField');
    const val = input.value.trim();
    if(!val) return;
    chat.messages.push({from:'me', text:val, time:nowTime()});
    input.value='';
    renderChatLog();
    setTimeout(()=>{
      chat.messages.push({from:'them', text:sellerReply(val, ctx), time:nowTime()});
      if(state.activeChatShop === shopId && $('.screen.active') && $('.screen.active').dataset.screen==='chat'){
        renderChatLog();
      } else {
        chat.unread = (chat.unread||0)+1;
        updateChatsBadge();
      }
    }, 1100);
  };
  $('#chatSendBtn').onclick = send;
  $('#chatInputField').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  renderChatLog();
}
function renderChatLog(){
  const chat = state.shopChats[state.activeChatShop];
  const box = $('#chatLog');
  if(!box || !chat) return;
  box.innerHTML = `<div class="chat-day">Сегодня</div>` + chat.messages.map(m=>`
    <div class="bubble ${m.from==='me'?'me':'them'}">${m.text}<time>${m.time}</time></div>
  `).join('');
  box.scrollTop = box.scrollHeight;

function sellerReply(text, ctx){
  const t = (text||'').toLowerCase();
  const has = (...ws)=>ws.some(w=>t.includes(w));
  if(has('размер','ростов','подойд','мал','велик'))
    return 'Да, размеры S, M, L и XL сейчас в наличии. Если сомневаетесь между двумя — берите меньший, модель садится свободно.';
  if(has('наличи','есть ли','остал'))
    return ctx ? `Да, «${ctx.name}» есть в наличии. Готовы отправить сегодня.` : 'Да, товар в наличии, готовы отправить сегодня.';
  if(has('доставк','привез','отправ','сдэк','почт'))
    return 'Доставка по Москве — 1–2 дня, по России 3–7 дней. Отправляем СДЭК или Почтой России.';
  if(has('самовывоз','забрать','адрес','магазин где','пункт'))
    return 'Самовывоз возможен, магазин работает с 10:00 до 21:00 без выходных. Отложим товар на 2 дня.';
  if(has('скидк','дешевле','торг','снизить','дорого'))
    return 'Сейчас на товар уже действует скидка. При заказе от двух вещей дадим дополнительно 10%.';
  if(has('цена','стоит','сколько'))
    return ctx ? `Цена «${ctx.name}» — ${ctx.price}. Это уже с учётом скидки.` : 'Актуальная цена указана в карточке товара, она уже со скидкой.';
  if(has('возврат','обмен','брак','не подойдет','не подойдёт'))
    return 'Обмен и возврат в течение 14 дней, если сохранены бирки. Доставку при обмене берём на себя.';
  if(has('состав','материал','ткан','хлоп'))
    return 'Состав: 95% хлопок, 5% эластан. Плотное пике, не растягивается в вороте.';
  if(has('оплат','карт','налич','перевод'))
    return 'Оплата картой онлайн или при получении. Также принимаем перевод по СБП.';
  if(has('привет','здравств','добрый','салам','ассалам'))
    return 'Здравствуйте! Рады помочь — что вас интересует?';
  if(has('спасибо','благодар','ок','хорошо','понял'))
    return 'Пожалуйста! Если появятся вопросы — пишите, всегда на связи.';
  return 'Спасибо за сообщение! Уточню детали и вернусь с ответом в ближайшее время.';
}
